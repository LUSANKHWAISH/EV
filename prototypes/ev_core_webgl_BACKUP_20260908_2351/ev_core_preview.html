<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>E.V. Core Preview</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; height:100%; }
  canvas { display:block; }
  #hud {
    position:fixed; left:20px; bottom:20px; color:#7fd8ff; font-family:monospace;
    font-size:14px; text-shadow:0 0 6px rgba(0,200,255,0.6); user-select:none;
  }
  #hud .state { font-size:18px; font-weight:bold; letter-spacing:2px; }
  #hud .keys { color:#4a6a78; font-size:11px; margin-top:6px; }
</style>
</head>
<body>
<div id="hud">
  <div class="state">STATE: <span id="stateLabel">IDLE</span></div>
  <div class="keys">1 IDLE&nbsp; 2 LISTENING&nbsp; 3 THINKING&nbsp; 4 PLANNING&nbsp; 5 APPROVAL&nbsp; 6 EXECUTING&nbsp; 7 VERIFYING&nbsp; 8 SPEAKING&nbsp; 9 SUCCESS&nbsp; 0 FAILED&nbsp; S SLEEP</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
<script>

// ---------------------------------------------------------------
// CONFIG
// ---------------------------------------------------------------
const CONFIG = {
  armCount: 2,
  armParticles: 34000,
  coreParticles: 4000,
  haloParticles: 8000,
  galaxyRadius: 9,
  coreRadius: 1.4,
  spin: 3.2,
  armSpread: 0.55,      // lateral scatter of arm particles (symmetric xyz jitter)
  vertSpread: 0.35,     // disk thickness
  rotationSpeed: 0.02,  // idle rotation, radians/sec baseline
};

const STATES = {
  IDLE:      { speedMul: 1.0,  energy: 1.0,  tint: 0xffffff },
  LISTENING: { speedMul: 1.6,  energy: 1.4,  tint: 0x9fe8ff },
  THINKING:  { speedMul: 2.4,  energy: 1.6,  tint: 0x6fd0ff },
  PLANNING:  { speedMul: 1.3,  energy: 1.2,  tint: 0xbfe8ff },
  APPROVAL:  { speedMul: 0.5,  energy: 1.1,  tint: 0xffcc66 },
  EXECUTING: { speedMul: 3.0,  energy: 1.9,  tint: 0xffffff },
  VERIFYING: { speedMul: 2.0,  energy: 1.5,  tint: 0x7fffd4 },
  SPEAKING:  { speedMul: 1.8,  energy: 1.7,  tint: 0xffffff },
  SUCCESS:   { speedMul: 1.0,  energy: 2.2,  tint: 0x9fffb0 },
  FAILED:    { speedMul: 0.6,  energy: 0.8,  tint: 0xff5f5f },
  SLEEP:     { speedMul: 0.08, energy: 0.35, tint: 0x556677 },
};
let currentState = 'IDLE';

// ---------------------------------------------------------------
// SCENE / CAMERA / RENDERER
// ---------------------------------------------------------------
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.1, 200
);
// Elevated 3/4 view — looking DOWN into the galaxy, not edge-on.
const camBaseX = 0, camBaseY = 9.5, camBaseZ = 8.5;
camera.position.set(camBaseX, camBaseY, camBaseZ);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const galaxyGroup = new THREE.Group();
scene.add(galaxyGroup);

// ---------------------------------------------------------------
// SOFT GLOW SPRITE TEXTURE (for nucleus glow, no external assets needed)
// ---------------------------------------------------------------
function makeGlowTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.2, 'rgba(255,240,220,0.9)');
  g.addColorStop(0.5, 'rgba(255,200,150,0.25)');
  g.addColorStop(1.0, 'rgba(255,200,150,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}
const glowTex = makeGlowTexture();

// Simple circular point sprite texture (soft dot, not square)
function makeDotTexture() {
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.9)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}
const dotTex = makeDotTexture();

// ---------------------------------------------------------------
// COLOR PALETTE — scattered mix, NOT radial gradient
// ---------------------------------------------------------------
const coolColors = [
  new THREE.Color(0xffffff),
  new THREE.Color(0xcfe9ff),
  new THREE.Color(0x9fd0ff),
];
const warmColors = [
  new THREE.Color(0xffb060),
  new THREE.Color(0xff8a3d),
];
function pickColor() {
  if (Math.random() < 0.8) {
    return coolColors[Math.floor(Math.random() * coolColors.length)];
  } else {
    return warmColors[Math.floor(Math.random() * warmColors.length)];
  }
}

// ---------------------------------------------------------------
// GEOMETRY BUILD — core bulge (true 3D sphere) + spiral arms + halo
// ---------------------------------------------------------------
function buildGalaxy() {
  const total = CONFIG.coreParticles + CONFIG.armParticles + CONFIG.haloParticles;
  const positions = new Float32Array(total * 3);
  const colors = new Float32Array(total * 3);
  const sizes = new Float32Array(total);

  let idx = 0;

  // --- CORE BULGE: true spherical volume distribution (fixes the
  //     old "vertical streak" bug — no axis is ever forced to 0) ---
  for (let i = 0; i < CONFIG.coreParticles; i++) {
    const u = Math.random();
    const r = CONFIG.coreRadius * Math.cbrt(u); // uniform-in-volume radius
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.sin(phi) * Math.sin(theta) * 0.6; // slightly flattened bulge
    const z = r * Math.cos(phi);

    positions[idx*3+0] = x;
    positions[idx*3+1] = y;
    positions[idx*3+2] = z;

    const c = Math.random() < 0.9 ? new THREE.Color(0xffffff).lerp(new THREE.Color(0xffd9b0), Math.random()*0.6)
                                   : pickColor();
    colors[idx*3+0] = c.r; colors[idx*3+1] = c.g; colors[idx*3+2] = c.b;
    sizes[idx] = 1.6 + Math.random() * 1.2;
    idx++;
  }

  // --- SPIRAL ARMS: symmetric xyz jitter, no per-axis inversion ---
  for (let i = 0; i < CONFIG.armParticles; i++) {
    const armIndex = i % CONFIG.armCount;
    const t = Math.pow(Math.random(), 1.4); // bias toward center, smooth taper
    const radius = CONFIG.coreRadius * 0.6 + t * (CONFIG.galaxyRadius - CONFIG.coreRadius * 0.6);

    const armAngle = (armIndex / CONFIG.armCount) * Math.PI * 2;
    const spinAngle = radius * CONFIG.spin * 0.35;
    const scatterAngle = (Math.random() - 0.5) * 0.5 * (1.0 - t * 0.4);
    const angle = armAngle + spinAngle + scatterAngle;

    const spreadMag = CONFIG.armSpread * (0.3 + (1.0 - t) * 0.7);
    const jitterX = (Math.random() - 0.5) * spreadMag;
    const jitterZ = (Math.random() - 0.5) * spreadMag;
    const jitterY = (Math.random() - 0.5) * CONFIG.vertSpread * (0.4 + (1.0 - t));

    const x = Math.cos(angle) * radius + jitterX;
    const z = Math.sin(angle) * radius + jitterZ;
    const y = jitterY;

    positions[idx*3+0] = x;
    positions[idx*3+1] = y;
    positions[idx*3+2] = z;

    const c = pickColor();
    colors[idx*3+0] = c.r; colors[idx*3+1] = c.g; colors[idx*3+2] = c.b;
    sizes[idx] = (0.6 + Math.random() * 1.0) * (1.0 - t * 0.3);
    idx++;
  }

  // --- HALO: sparse background dust, wide volume ---
  for (let i = 0; i < CONFIG.haloParticles; i++) {
    const r = CONFIG.galaxyRadius * (0.6 + Math.random() * 0.9);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.sin(phi) * Math.sin(theta) * 0.25;
    const z = r * Math.cos(phi);

    positions[idx*3+0] = x;
    positions[idx*3+1] = y;
    positions[idx*3+2] = z;

    const c = pickColor();
    colors[idx*3+0] = c.r; colors[idx*3+1] = c.g; colors[idx*3+2] = c.b;
    sizes[idx] = 0.4 + Math.random() * 0.5;
    idx++;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.PointsMaterial({
    size: 0.09,
    map: dotTex,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
  });

  const points = new THREE.Points(geo, mat);
  galaxyGroup.add(points);
  return points;
}
const galaxyPoints = buildGalaxy();

// ---------------------------------------------------------------
// NUCLEUS GLOW SPRITE
// ---------------------------------------------------------------
const nucleusMat = new THREE.SpriteMaterial({
  map: glowTex,
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
});
const nucleus = new THREE.Sprite(nucleusMat);
nucleus.scale.set(4.5, 4.5, 1);
galaxyGroup.add(nucleus);

// small extra-bright hot center
const hotMat = new THREE.SpriteMaterial({
  map: glowTex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
});
const hotCenter = new THREE.Sprite(hotMat);
hotCenter.scale.set(1.6, 1.6, 1);
galaxyGroup.add(hotCenter);

// ---------------------------------------------------------------
// MOUSE PARALLAX (camera orbit-ish, damped)
// ---------------------------------------------------------------
let targetCamX = camBaseX, targetCamY = camBaseY;
let mouseX = 0, mouseY = 0;

window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

// ---------------------------------------------------------------
// STATE INPUT (keyboard, matches HUD legend)
// ---------------------------------------------------------------
const keyMap = {
  '1':'IDLE','2':'LISTENING','3':'THINKING','4':'PLANNING','5':'APPROVAL',
  '6':'EXECUTING','7':'VERIFYING','8':'SPEAKING','9':'SUCCESS','0':'FAILED','s':'SLEEP','S':'SLEEP'
};
window.addEventListener('keydown', (e) => {
  const s = keyMap[e.key];
  if (s) {
    currentState = s;
    document.getElementById('stateLabel').textContent = s;
  }
});

// ---------------------------------------------------------------
// RESIZE
// ---------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------
// ANIMATE
// ---------------------------------------------------------------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();
  const state = STATES[currentState];

  // idle rotation, modulated by state speed multiplier
  galaxyGroup.rotation.y += CONFIG.rotationSpeed * state.speedMul * dt * 10;

  // nucleus breathing / energy pulse
  const pulse = 1.0 + Math.sin(t * 1.6) * 0.06 * state.energy;
  nucleus.scale.set(4.5 * pulse * state.energy, 4.5 * pulse * state.energy, 1);
  hotCenter.scale.set(1.6 * pulse, 1.6 * pulse, 1);

  nucleus.material.color.set(state.tint);
  hotCenter.material.color.set(0xffffff);

  // particle subtle drift via material size flicker (cheap twinkle)
  galaxyPoints.material.size = 0.09 * (0.95 + Math.sin(t * 3.0) * 0.03);

  // damped camera parallax orbit
  targetCamX = camBaseX + mouseX * 3.2;
  targetCamY = camBaseY - mouseY * 1.6;
  camera.position.x += (targetCamX - camera.position.x) * 0.03;
  camera.position.y += (targetCamY - camera.position.y) * 0.03;
  camera.position.z = camBaseZ;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate();

</script>
</body>
</html>
